<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viele Ichs – Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f4fa;--ink:#1b1f3b;--mute:#5f6586;--card:#fff;--line:#dfe2f1;--ok:#1f8a5a;--bad:#c2307a;--gold:#f2b705;--goldd:#8a6200;--blue:#3b5bdb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--ink:#eceefc;--mute:#9ea4cc;--card:#1c2040;--line:#323864;--ok:#3cc48a;--bad:#ee5fa3;--gold:#f2bb3d;--goldd:#f2bb3d;--blue:#8aa0ff}}
:root[data-theme="dark"]{--bg:#12142a;--ink:#eceefc;--mute:#9ea4cc;--card:#1c2040;--line:#323864;--ok:#3cc48a;--bad:#ee5fa3;--gold:#f2bb3d;--goldd:#f2bb3d;--blue:#8aa0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:20px 18px 120px}
h1{font-size:2.5rem;line-height:1.02;font-weight:800;margin:36px 0 16px;letter-spacing:-.03em}
h2{font-size:1.4rem;margin:0 0 10px;font-weight:800}
p{margin:0 0 14px}
.mute{color:var(--mute);font-size:.93rem}
.q{font-size:1.45rem;font-weight:800;line-height:1.2;margin:22px 0 18px;letter-spacing:-.01em}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.cur{transform:scale(1.35);background:var(--blue)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1.02rem;color:inherit;background:var(--card);border:2px solid transparent;border-radius:14px;padding:15px 16px;margin:10px 0;cursor:pointer;box-shadow:0 1px 0 var(--line);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card));animation:shake .35s}
.opt.gone{opacity:.25;text-decoration:line-through}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 26px;cursor:pointer;margin:4px 8px 4px 0}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{padding:8px 16px;font-size:.9rem}
.btn:disabled{opacity:.35;cursor:not-allowed}
.opt:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.expl{padding:14px 16px;margin:14px 0;background:var(--card);border-radius:14px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.stat{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.streak{display:flex;align-items:flex-end;gap:10px;font-weight:600;color:var(--goldd)}
.flame{display:block;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite;transition:height .5s ease,width .5s ease}
.flame.grow{animation:flick 1.1s ease-in-out infinite,grow .5s ease}
.flame.off{animation:none}
.streak{min-height:80px;gap:14px;color:var(--ink)}
.flbtn{background:none;border:0;padding:0;cursor:pointer;position:relative;width:80px;height:80px;display:flex;align-items:flex-end;justify-content:center}
.flbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
.sinfo{display:flex;flex-direction:column;gap:5px;padding-bottom:6px;font-weight:400}
.sinfo b{font-size:1.15rem;line-height:1.1;font-weight:800}
.pips{display:flex;gap:5px}
.pips i{width:24px;height:8px;border-radius:4px;background:var(--line);transition:background .3s}
.pips i.f{background:var(--gold)}
.sp{position:absolute;left:50%;bottom:45%;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),-55px);opacity:0}}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(-1.5deg)}50%{transform:scaleY(1.07) rotate(1.5deg)}}
@keyframes grow{from{opacity:.4;filter:brightness(2)}}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#bar>div{width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.coins{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem}
.coin{width:26px;height:26px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--goldd);display:inline-block}
.coin.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5) rotate(25deg)}}
.fly{position:fixed;z-index:30;font-weight:800;color:var(--goldd);pointer-events:none;animation:fly 1s ease forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
/* sheet */
#back{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:85%;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s ease;display:flex;flex-direction:column;visibility:hidden}
body.open #back{opacity:1;pointer-events:auto}
body.open #sheet{transform:none;visibility:visible}
#sheet .in{width:100%;max-width:600px;margin:0 auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{font:inherit;font-weight:600;background:var(--card);color:var(--ink);border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0}
.price{font-weight:800;white-space:nowrap}
.ticket{border:3px dashed var(--blue);border-radius:16px;padding:18px;text-align:center;background:var(--card);margin:12px 0}
.ticket b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1;margin:4px 0 6px}
.hw{margin:12px 0 6px}
.hw label{position:relative;display:inline-block}
.hw label:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.hwfile{position:absolute;opacity:0;width:1px;height:1px}
.hwout{white-space:pre-wrap;text-align:left;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;font-size:.95rem}
.x{float:right;font:inherit;background:none;border:0;color:var(--ink);font-size:1.6rem;cursor:pointer;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main><div id="screen"></div></main>

<div id="bar"><div>
 <div class="coins"><span class="coin" id="cc"></span><span id="cn">0</span></div>
 <div class="mute" id="hint"></div>
 <button class="btn small" id="shopbtn" style="margin:0">Shop öffnen</button>
</div></div>

<div id="back"></div>
<div id="sheet" role="dialog" aria-label="Shop" aria-modal="true"><div class="in">
 <button class="x" id="close" aria-label="Schließen">×</button>
 <div class="tabs"><button class="tab on" id="t1">Shop</button><button class="tab" id="t2">Meine Gutscheine</button></div>
 <div id="shopbody"></div>
</div></div>

<script>
const Q=[
 ["Was bedeutet „soziale Identität“?",["Der Teil deines Selbstbildes, der aus Gruppen kommt, zu denen du gehörst","Dein Name im Pass","Dein Social-Media-Profil","Die Meinung deiner Lehrer über dich"],0,"Soziale Identität entsteht aus Zugehörigkeiten, zum Beispiel Familie, Klasse, Sportverein oder Fangemeinde."],
 ["Du redest mit Freund:innen anders als mit deiner Lehrerin. Wie heißt das?",["Mobbing","Code-Switching","Identitätsverlust","Spiegeln"],1,"Code-Switching heißt, Sprache und Verhalten dem Umfeld anzupassen. Das machen fast alle, oft ohne es zu merken."],
 ["Wer prägte den Begriff „Intersektionalität“?",["Albert Einstein","Sigmund Freud","Kimberlé Crenshaw","Greta Thunberg"],2,"Kimberlé Crenshaw zeigte, dass sich Merkmale wie Geschlecht, Herkunft und Alter überlagern und besondere Erfahrungen erzeugen."],
 ["Bleibt die eigene Identität ein Leben lang gleich?",["Ja, sie ist ab der Geburt fest","Nein, sie verändert sich mit Erfahrungen","Nur bis 18","Nur wenn man umzieht"],1,"Identität ist nicht fertig. Sie verändert sich mit neuen Erfahrungen, Menschen und Lebensphasen."],
 ["Wie viele Identitäten (Rollen) kann ein Mensch gleichzeitig haben?",["Genau eine","Höchstens zwei","Mehrere gleichzeitig","Null, wenn er sich unsicher fühlt"],2,"Du kannst gleichzeitig Tochter oder Sohn, Freund:in, Schüler:in, Fan, Geschwisterkind und vieles mehr sein."],
 ["Wer sollte entscheiden, wie du dich selbst bezeichnest?",["Deine Klasse","Du selbst","Die Gesellschaft","Wer dich zuerst kennenlernt"],1,"Selbstbezeichnung ist dein Recht. Andere dürfen fragen und zuhören, aber nicht für dich festlegen."],
 ["Jemand sagt: „Du bist ein Mädchen, du magst bestimmt keine Technik.“ Was ist das?",["Ein Kompliment","Ein Stereotyp / eine Fremdzuschreibung","Eine Statistik","Eine wissenschaftliche Tatsache"],1,"Ein Stereotyp ist eine vereinfachte Annahme über eine Gruppe. Auf den Einzelnen trifft sie oft nicht zu."],
 ["Du sollst am gleichen Tag zur Familienfeier und zum Konzert mit Freunden. Wie nennt man diesen Zwiespalt?",["Rollenkonflikt","Wetterumschwung","Identitätsdiebstahl","Gruppenzwang"],0,"Wenn zwei Rollen gleichzeitig etwas verlangen, entsteht ein Rollenkonflikt. Das ist normal."],
 ["Was bedeutet „Ingroup“?",["Eine Gruppe, zu der man sich selbst zählt","Eine geheime Online-Gruppe","Eine Gruppe, die man nicht mag","Eine Gruppe nur für Erwachsene"],0,"Die Ingroup ist das „Wir“. Die Outgroup sind „die anderen“. Dieses Denken geht schnell, kann aber Vorurteile fördern."],
 ["Zeigt ein Online-Profil die ganze Person?",["Ja, immer","Nein, nur einen ausgewählten Ausschnitt","Ja, wenn es viele Follower hat","Nur bei Fotos"],1,"Profile sind meist eine kuratierte Auswahl. Wer das weiß, vergleicht sich weniger mit dem, was andere zeigen."],
 ["Was meint „Geschlechtsidentität“?",["Das Geschlecht im Ausweis","Das innere Gefühl, welchem Geschlecht man sich zugehörig fühlt","Die Kleidung, die man trägt","Die Wahl des Berufs"],1,"Geschlechtsidentität beschreibt, wie sich jemand selbst empfindet. Sie kann, muss aber nicht mit dem Eintrag bei der Geburt übereinstimmen."],
 ["Was ist Diskriminierung?",["Wenn man jemanden schlecht findet","Wenn jemand wegen eines Merkmals benachteiligt wird","Wenn man anderer Meinung ist","Wenn man allein sein will"],1,"Diskriminierung ist eine Benachteiligung wegen Merkmalen wie Herkunft, Geschlecht, Religion oder Behinderung. Eine Meinung allein ist es nicht."],
 ["Beim „Spiegel-Selbst“ sehen wir uns auch so, wie wir glauben, dass …",["unsere Haustiere uns sehen","andere uns sehen","das Wetter uns sieht","wir nur im Traum sind"],1,"Wir bilden unser Selbstbild auch darüber, wie wir glauben, dass andere uns wahrnehmen. Das kann täuschen."]
];
const SHOP=[["Hausaufgaben-Joker",5,"Eine Hausaufgabe, die du nach Absprache auslassen darfst."],["Ein Tag keine Schule",10,"Dein Gutschein für einen schulfreien Tag."]];
const $=id=>document.getElementById(id),scr=$("screen");
let coins=0,owned=[],order=[],qi=0,right=0,streak=0,res=[],used=false,tab=1;
try{coins=+localStorage.getItem("vi3_coins")||0;owned=JSON.parse(localStorage.getItem("vi3_owned")||"[]")}catch(e){}
function save(){try{localStorage.setItem("vi3_coins",coins);localStorage.setItem("vi3_owned",JSON.stringify(owned))}catch(e){}}
function upd(gain){
 $("cn").textContent=coins;
 const need=Math.max(0,10-coins);
 $("hint").textContent=need?`Noch ${need} bis schulfrei`:"Schulfrei möglich!";
 if(gain){const c=$("cc");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
  const r=c.getBoundingClientRect(),f=document.createElement("div");f.className="fly";f.textContent="+"+gain;f.style.left=r.left+"px";f.style.top=(r.top-10)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
 if(document.body.classList.contains("open"))renderShop();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function flameHTML(grow){
 const h=Math.min(30+streak*7,78),on=streak>0,hot=streak>=6,g=Math.min(streak*2,14);
 const o=hot?"#2f7bff":"#ff7a1a",c=hot?"#c6e4ff":"#ffd23f";
 const p=streak===0?0:(streak%3===0?3:streak%3);
 return `<button class="flbtn" aria-label="Serie ${streak}, tippen für Funken"><svg class="flame ${on?(grow?"grow":""):"off"}" height="${h}" width="${h}" viewBox="0 0 24 24" aria-hidden="true" style="filter:${on?`drop-shadow(0 0 ${g}px ${o})`:"none"}"><path d="M12 1c1 4-4 6-4 11a4 4 0 008 0c0-1.2-.5-2.2-1-3 3 1 6 4 6 8a9 9 0 01-18 0C3 9 11 7 12 1z" fill="${on?o:"var(--line)"}"/><path d="M12 23a4 4 0 01-4-4c0-2.5 3-4 4-7 1 3 4 4.5 4 7a4 4 0 01-4 4z" fill="${on?c:"var(--bg)"}"/></svg></button><div class="sinfo"><b>${on?"Serie "+streak:"Keine Serie"}</b><span class="pips">${[0,1,2].map(n=>`<i class="${n<p?"f":""}"></i>`).join("")}</span><span class="mute">${on?(p===3?"Bonus geholt!":(3-p)+" bis zum Bonus"):"Richtig antworten, um zu starten"}</span></div>`;
}
function puff(el){
 if(!el)return;
 for(let k=0;k<7;k++){const s=document.createElement("i");s.className="sp";s.style.setProperty("--dx",(Math.random()*70-35)+"px");s.style.background=streak>=6?"#7db4ff":"#ffb02e";s.style.animationDelay=(k*40)+"ms";el.appendChild(s);setTimeout(()=>s.remove(),1000)}
}
document.addEventListener("click",e=>{const f=e.target.closest(".flbtn");if(f)puff(f)});
function flameOld(grow){
 const h=Math.min(30+streak*9,90),on=streak>0;
 return `<svg class="flame ${on?(grow?"grow":""):"off"}" height="${h}" width="${h}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1 4-4 6-4 11a4 4 0 008 0c0-1.200-.5-2.200-1-3 3 1 6 4 6 8a9 9 0 01-18 0C3 9 11 7 12 1z" fill="${on?"#ff7a1a":"var(--line)"}"/><path d="M12 23a4 4 0 01-4-4c0-2.500 3-4 4-7 1 3 4 4.500 4 7a4 4 0 01-4 4z" fill="${on?"#ffd23f":"var(--bg)"}"/></svg><span>${on?"Serie "+streak+" – "+(3-streak%3)+" bis zum Bonus":"Starte eine Serie"}</span>`;
}
function dots(){return `<div class="dots" aria-hidden="true">${Q.map((_,i)=>`<i class="${res[i]||(i===qi?"cur":"")}"></i>`).join("")}</div>`}
function home(){
 scr.innerHTML=`<h1>Wie gut kennst du dich mit Identität aus?</h1>
 <p>Beantworte Fragen zum Thema „verschiedene Identitäten“. Jede richtige Antwort bringt <b>1 Coin</b>, drei richtige in Folge bringen einen <b>Bonus-Coin</b>. Im Shop, den du unten jederzeit öffnen kannst, tauschst du Coins gegen Belohnungen, zum Beispiel einen <b>Tag keine Schule</b>.</p>
 <button class="btn" id="go">Quiz starten</button>`;
 $("go").onclick=startQuiz;
}
function startQuiz(){order=shuffle(Q.map((_,i)=>i));qi=0;right=0;streak=0;res=[];ask()}
function ask(){
 used=false;
 const q=Q[order[qi]],opts=shuffle(q[1].map((t,i)=>[t,i]));
 scr.innerHTML=`${dots()}
 <div class="q">${q[0]}</div>
 <div id="o">${opts.map(o=>`<button class="opt" data-i="${o[1]}">${o[0]}</button>`).join("")}</div>
 <div class="stat"><button class="btn ghost small" id="j">50:50 Joker (1 Coin)</button><span class="streak" id="st">${flameHTML()}</span></div>
 <div id="fb"></div>`;
 scr.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
 $("j").disabled=coins<1;
 $("j").onclick=()=>{
  if(coins<1||used)return;used=true;coins--;save();upd();$("j").disabled=true;
  const wrong=shuffle([...scr.querySelectorAll(".opt")].filter(x=>+x.dataset.i!==q[2])).slice(0,2);
  wrong.forEach(x=>{x.disabled=true;x.classList.add("gone")});
 };
}
function answer(b,q){
 const ok=+b.dataset.i===q[2];
 scr.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q[2])x.classList.add("ok")});
 $("j").disabled=true;
 if(!ok)b.classList.add("bad");
 let msg,gain=0;
 if(ok){right++;streak++;gain=1;msg="Richtig! +1 Coin";if(streak%3===0){gain=2;msg="Richtig! +1 Coin und +1 Bonus für 3 in Folge"}}
 else{streak=0;msg="Leider falsch, kein Coin."}
 res[qi]=ok?"ok":"bad";
 $("st").innerHTML=flameHTML(ok);if(ok)puff($("st").querySelector(".flbtn"));
 if(gain){coins+=gain;save()}
 upd(gain);
 scr.querySelector(".dots").outerHTML=dots();
 $("fb").innerHTML=`<div class="expl"><b>${msg}</b><br>${q[3]}</div><button class="btn" id="nx">${qi<Q.length-1?"Weiter":"Ergebnis"}</button>`;
 $("nx").onclick=()=>{qi++;qi<Q.length?ask():result()};
 $("nx").focus();
}
function result(){
 scr.innerHTML=`<h2>${right} von ${Q.length} richtig</h2>
 <p>${right>=11?"Stark! Du kennst dich richtig gut aus.":right>=7?"Gut gemacht. Mit einer zweiten Runde sitzt es noch besser.":"Ein guter Anfang. Die Erklärungen helfen dir beim nächsten Versuch."}</p>
 <p class="mute">Du hast ${coins} Coins.</p>
 <button class="btn" id="again">Nochmal spielen</button><button class="btn ghost" id="sh">Shop öffnen</button>`;
 $("again").onclick=startQuiz;$("sh").onclick=()=>openShop(1);
}
const HWPROMPT="Das Bild zeigt eine Hausaufgabe. Löse sie auf Deutsch. Erkläre jeden Schritt so einfach, dass eine Schülerin oder ein Schüler es verstehen und selbst nachrechnen kann, und schreibe am Ende das Ergebnis. Schreibe ohne Markdown, nur normalen Text mit kurzen Absätzen. Wenn auf dem Bild keine Hausaufgabe zu erkennen ist, sag das kurz und freundlich.";
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function hwBlock(v){
 const i=owned.indexOf(v);
 if(v.used)return `<div class="hw"><span class="mute">Joker benutzt. Deine Lösung:</span><div class="hwout">${esc(v.answer||"")}</div></div>`;
 return `<div class="hw"><label class="btn small">Hausaufgabe scannen<input class="hwfile" type="file" accept="image/*" capture="environment" data-i="${i}"></label><div class="hwout" id="hwout" hidden></div><div class="mute" style="margin-top:6px">Mach ein Foto von deiner Aufgabe. Dieser Joker gilt für eine Aufgabe.</div></div>`;
}
document.addEventListener("change",async e=>{
 const inp=e.target.closest&&e.target.closest(".hwfile");
 if(!inp||!inp.files[0])return;
 const v=owned[+inp.dataset.i],file=inp.files[0],out=$("hwout");
 out.hidden=false;out.textContent="Claude schaut sich deine Aufgabe an …";
 try{
  const sample=window.claude?await window.claude.use("sample"):null;
  if(!sample){out.textContent="Die Hausaufgaben-Hilfe funktioniert nur, wenn du das Spiel über den claude.ai-Link öffnest und bei Claude angemeldet bist.";return}
  const r=await sample(HWPROMPT,{images:[file],cache:false,onText:({text})=>{out.textContent=text}});
  v.used=true;v.answer=r.text;save();out.textContent=r.text;
 }catch(err){
  const m={not_granted:"Du hast Claude für diese Seite nicht erlaubt.",rate_limited:"Gerade zu viele Anfragen. Versuch es später nochmal.",image_rejected:"Das Bild geht nicht. Probier ein anderes Foto.",images_unavailable:"Fotos gehen hier leider nicht.",refused:"Dazu kann Claude nichts sagen. Probier ein anderes Foto."};
  out.textContent=err.text||m[err.code]||"Das hat nicht geklappt. Versuch es nochmal.";
 }finally{inp.value=""}
});
function renderShop(){
 $("t1").classList.toggle("on",tab===1);$("t2").classList.toggle("on",tab===2);
 if(tab===1){
  $("shopbody").innerHTML=`<p class="mute">Du hast ${coins} Coins.</p>`+SHOP.map((s,i)=>`<div class="item"><div><b>${s[0]}</b><div class="mute">${s[2]}</div></div><div style="text-align:right"><span class="price">${s[1]} Coins</span><br><button class="btn small buy" data-i="${i}" style="margin:6px 0 0" ${coins<s[1]?"disabled":""}>Kaufen</button></div></div>`).join("");
  $("shopbody").querySelectorAll(".buy").forEach(b=>b.onclick=()=>{
   const s=SHOP[+b.dataset.i];if(coins<s[1])return;
   coins-=s[1];owned.push({n:s[0],d:new Date().toLocaleDateString("de-DE")});save();tab=2;upd();
  });
 }else{
  $("shopbody").innerHTML=owned.length?owned.slice().reverse().map(v=>`<div class="ticket"><span class="mute">Gutschein vom ${v.d}</span><b>${v.n}</b>${v.n==="Hausaufgaben-Joker"?hwBlock(v):""}<span class="mute">Echt einlösen geht nur mit Zustimmung von Eltern und Schule. Zeig ihn ihnen und frag nett.</span></div>`).join(""):'<p class="mute">Noch keine Gutscheine. Sammle Coins und kauf einen im Shop.</p>';
 }
}
function openShop(t){tab=t||1;renderShop();document.body.classList.add("open");$("close").focus()}
function closeShop(){document.body.classList.remove("open");$("shopbtn").focus()}
$("shopbtn").onclick=()=>openShop(1);
$("close").onclick=closeShop;$("back").onclick=closeShop;
$("t1").onclick=()=>{tab=1;renderShop()};$("t2").onclick=()=>{tab=2;renderShop()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeShop()});
upd();home();
</script>
</body>
</html>
